name: 导出《鱿鱼之泪》(Release + Pages)

# 导出产物不再提交回仓库：
#   - HTML 部署到 GitHub Pages（在线阅读，需在 Settings → Pages 把 Source 设为 GitHub Actions）
#   - PDF / EPUB / DOCX / HTML 上传到滚动 release「latest」
# 下载链接（永远指向最新草稿）：
#   https://github.com/lightconsen/squidtears/releases/latest/download/squid-tears.pdf 等

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '01_drafts/**'
      - 'story.md'
      - '.github/workflows/export.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  export:
    name: 生成四种格式
    runs-on: ubuntu-latest
    container: pandoc/latex:latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装依赖与中文字体（PDF 排版用）
        # latest 为 Alpine base：用 apk 装字体 + WeasyPrint（HTML→PDF，Pango 原生
        # 中文断行，绕开 xelatex 的 xeCJK/verbatim 中文坑）；-debian 变体用 apt
        run: |
          set -e
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache font-noto-cjk git py3-weasyprint
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq fonts-noto-cjk git python3-pip
            pip3 install --break-system-packages weasyprint
          else
            echo "未识别的包管理器" >&2
            exit 1
          fi

      - name: 导出四种格式
        run: |
          set -e
          # 章节文件按数字顺序排列（01 → 16），避免 10_ 排在 09_ 前
          # 容器默认 shell 为 sh（无 bash/mapfile/pipefail），用纯 POSIX 写法
          FILES=""
          for f in $(ls 01_drafts/part1_seed/*.md | sort -V); do
            FILES="$FILES $f"
          done
          echo "待导出章节："
          for f in $FILES; do echo "  $f"; done

          mkdir -p _exports

          # HTML（自包含单文件 + 目录，用于在线阅读）
          pandoc $FILES \
            -s --embed-resources \
            --toc \
            --metadata title="鱿鱼之泪" \
            --metadata author="1and0" \
            --metadata lang=zh-CN \
            -o _exports/squid-tears.html

          # DOCX
          pandoc $FILES \
            --metadata title="鱿鱼之泪" \
            --metadata author="1and0" \
            --metadata lang=zh-CN \
            -o _exports/squid-tears.docx

          # EPUB
          pandoc $FILES \
            --toc \
            --metadata title="鱿鱼之泪" \
            --metadata author="1and0" \
            --metadata lang=zh-CN \
            -o _exports/squid-tears.epub

          # PDF（WeasyPrint 渲染：CSS 控制中文断行/两端对齐/代码换行，
          # 不依赖 TeX 的 CJK 支持，杜绝右侧截断）
          cat > /tmp/pdf.css <<'CSS'
          @page { size: A4; margin: 2.2cm; }
          body { font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; font-size: 11pt; line-height: 1.75; text-align: justify; }
          h1 { font-size: 20pt; }
          h2 { font-size: 16pt; }
          h3 { font-size: 13pt; }
          pre { white-space: pre-wrap; overflow-wrap: break-word; font-family: "Noto Sans Mono CJK SC", "Noto Sans CJK SC", monospace; font-size: 9pt; }
          code { font-family: "Noto Sans Mono CJK SC", "Noto Sans CJK SC", monospace; }
          CSS

          pandoc $FILES \
            --pdf-engine=weasyprint \
            --toc \
            --css=/tmp/pdf.css \
            --metadata title="鱿鱼之泪" \
            --metadata author="1and0" \
            --metadata lang=zh-CN \
            -o _exports/squid-tears.pdf
          echo "PDF 大小：$(wc -c < _exports/squid-tears.pdf) bytes"

          # Pages 在线阅读用：根路径直接 serve index.html
          mkdir -p _pages
          cp _exports/squid-tears.html _pages/index.html

      - name: 上传四种格式（供 Release 使用）
        uses: actions/upload-artifact@v5
        with:
          name: squid-tears-exports
          path: _exports/

      - name: 上传 HTML（供 Pages 部署）
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages/

  release:
    name: 更新滚动 Release（latest）
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 下载导出文件
        uses: actions/download-artifact@v5
        with:
          name: squid-tears-exports
          path: _exports/

      - name: 重建 latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="latest"
          SHA="$(git rev-parse --short HEAD)"
          SHA_FULL="$(git rev-parse HEAD)"
          DATE="$(date +%Y-%m-%d)"

          # 每次 push 重建同一个 latest，避免 release 泛滥
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          NOTES=$(printf '自动构建于 %s（commit %s）。\n\n在线阅读（HTML）：https://lightconsen.github.io/squidtears/\nPDF / EPUB / DOCX 见本 release 附件。' "$DATE" "$SHA")

          gh release create "$TAG" \
            --target "$SHA_FULL" \
            --title "鱿鱼之泪 · 最新草稿" \
            --notes "$NOTES" \
            _exports/squid-tears.html \
            _exports/squid-tears.docx \
            _exports/squid-tears.epub \
            _exports/squid-tears.pdf

  deploy:
    name: 部署 GitHub Pages
    needs: export
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
