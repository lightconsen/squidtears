name: 导出 SquidTears (Release)

# 导出产物不提交回仓库：
#   - HTML / DOCX / EPUB / PDF 上传到滚动 release「latest」
#     （私有仓库，仅协作者可见；每次 push 重建同一个 latest，不累积历史版本）
#
# 本 workflow **不部署 GitHub Pages**：作品走独家签约路线，不应存在任何
# 自动公开的在线阅读入口。若将来需要恢复公开阅读，先确认签约合同允许。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '01_drafts/**'
      - 'story.md'
      - '.github/workflows/export.yml'

permissions:
  contents: write

concurrency:
  group: "export"
  cancel-in-progress: true

jobs:
  export:
    name: 生成四种格式
    runs-on: ubuntu-latest
    container: pandoc/latex:latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装依赖与中文字体（PDF 排版用）
        # latest 为 Alpine base：用 apk 装字体 + WeasyPrint（HTML→PDF，Pango 原生
        # 中文断行，绕开 xelatex 的 xeCJK/verbatim 中文坑）；-debian 变体用 apt
        run: |
          set -e
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache font-noto-cjk git py3-weasyprint
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq fonts-noto-cjk git python3-pip
            pip3 install --break-system-packages weasyprint
          else
            echo "未识别的包管理器" >&2
            exit 1
          fi

      - name: 导出四种格式
        run: |
          set -e
          # 章节文件按数字顺序排列（01 → 16），避免 10_ 排在 09_ 前
          # 容器默认 shell 为 sh（无 bash/mapfile/pipefail），用纯 POSIX 写法
          FILES=""
          for f in $(ls 01_drafts/*.md | sort -V); do
            FILES="$FILES $f"
          done
          echo "待导出章节："
          for f in $FILES; do echo "  $f"; done

          mkdir -p _exports

          # HTML（自包含单文件 + 目录，个人阅读用）
          pandoc $FILES \
            -s --embed-resources \
            --toc \
            --metadata title="鱿鱼之光（SquidTears）" \
            --metadata author="智人之后" \
            --metadata lang=zh-CN \
            -o _exports/squid-tears.html

          # DOCX
          pandoc $FILES \
            --metadata title="鱿鱼之光（SquidTears）" \
            --metadata author="智人之后" \
            --metadata lang=zh-CN \
            -o _exports/squid-tears.docx

          # EPUB
          pandoc $FILES \
            --toc \
            --metadata title="鱿鱼之光（SquidTears）" \
            --metadata author="智人之后" \
            --metadata lang=zh-CN \
            -o _exports/squid-tears.epub

          # PDF（WeasyPrint 渲染：CSS 控制中文断行/两端对齐/代码换行，
          # 不依赖 TeX 的 CJK 支持，杜绝右侧截断）
          cat > /tmp/pdf.css <<'CSS'
          @page { size: A4; margin: 2.2cm; }
          body { font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; font-size: 11pt; line-height: 1.75; text-align: justify; }
          h1 { font-size: 20pt; }
          h2 { font-size: 16pt; }
          h3 { font-size: 13pt; }
          pre { white-space: pre-wrap; overflow-wrap: break-word; font-family: "Noto Sans Mono CJK SC", "Noto Sans CJK SC", monospace; font-size: 9pt; }
          code { font-family: "Noto Sans Mono CJK SC", "Noto Sans CJK SC", monospace; }
          CSS

          pandoc $FILES \
            --pdf-engine=weasyprint \
            --toc \
            --css=/tmp/pdf.css \
            --metadata title="鱿鱼之光（SquidTears）" \
            --metadata author="智人之后" \
            --metadata lang=zh-CN \
            -o _exports/squid-tears.pdf
          echo "PDF 大小：$(wc -c < _exports/squid-tears.pdf) bytes"

      - name: 上传四种格式（供 Release 使用）
        uses: actions/upload-artifact@v5
        with:
          name: squid-tears-exports
          path: _exports/

  release:
    name: 更新滚动 Release（latest）
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 下载导出文件
        uses: actions/download-artifact@v5
        with:
          name: squid-tears-exports
          path: _exports/

      - name: 重建 latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="latest"
          SHA="$(git rev-parse --short HEAD)"
          SHA_FULL="$(git rev-parse HEAD)"
          DATE="$(date +%Y-%m-%d)"

          # 每次 push 重建同一个 latest，避免 release 泛滥
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          NOTES=$(printf '自动构建于 %s（commit %s）。\n\n《鱿鱼之光》（SquidTears）最新草稿导出：HTML / DOCX / EPUB / PDF 见本 release 附件。\n本仓库为私有创作工作区，产物仅供作者与协作者使用。' "$DATE" "$SHA")

          gh release create "$TAG" \
            --target "$SHA_FULL" \
            --title "鱿鱼之光（SquidTears）" \
            --notes "$NOTES" \
            _exports/squid-tears.html \
            _exports/squid-tears.docx \
            _exports/squid-tears.epub \
            _exports/squid-tears.pdf
