name: 导出《鱿鱼之泪》(HTML/DOCX/EPUB/PDF)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '01_drafts/**'
      - 'story.md'
      - '.github/workflows/export.yml'

jobs:
  export:
    name: 生成四种格式并提交回仓库
    runs-on: ubuntu-latest
    container: pandoc/latex:latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装依赖与中文字体（PDF 排版用）
        # latest 为 Alpine base（texlive-full 自带 xeCJK），用 apk；-debian 变体用 apt
        run: |
          set -e
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache font-noto-cjk git
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq fonts-noto-cjk git texlive-lang-chinese
          else
            echo "未识别的包管理器" >&2
            exit 1
          fi
          # 兜底：用 tlmgr 装 xeCJK（部分镜像缺它；装不上则 PDF 退回 mainfont 渲染中文）
          if command -v tlmgr >/dev/null 2>&1; then
            tlmgr install xeCJK 2>&1 | tail -3 || true
          fi
          echo "== xeCJK 诊断 =="
          kpsewhich xeCJK.sty || echo "xeCJK.sty: 不存在（PDF 将用 mainfont 渲染中文）"

      - name: 导出四种格式
        run: |
          set -e
          # 章节文件按数字顺序排列（01 → 16），避免 10_ 排在 09_ 前
          # 容器默认 shell 为 sh（无 bash/mapfile/pipefail），用纯 POSIX 写法
          FILES=""
          for f in $(ls 01_drafts/part1_seed/*.md | sort -V); do
            FILES="$FILES $f"
          done
          echo "待导出章节："
          for f in $FILES; do echo "  $f"; done

          mkdir -p 04_exports

          # HTML（自包含单文件 + 目录，用于在线阅读）
          pandoc $FILES \
            -s --embed-resources \
            --toc \
            --metadata title="鱿鱼之泪" \
            --metadata author="john2ai" \
            --metadata lang=zh-CN \
            -o 04_exports/squid-tears.html

          # DOCX
          pandoc $FILES \
            --metadata title="鱿鱼之泪" \
            --metadata author="john2ai" \
            --metadata lang=zh-CN \
            -o 04_exports/squid-tears.docx

          # EPUB
          pandoc $FILES \
            --toc \
            --metadata title="鱿鱼之泪" \
            --metadata author="john2ai" \
            --metadata lang=zh-CN \
            -o 04_exports/squid-tears.epub

          # PDF（xelatex + 中文字体；xeCJK 存在时启用 CJKmainfont，否则退回 mainfont 渲染中文）
          if [ -n "$(kpsewhich xeCJK.sty 2>/dev/null)" ]; then
            pandoc $FILES \
              --pdf-engine=xelatex \
              --toc \
              -V geometry:margin=2.5cm \
              -V mainfont="Noto Sans CJK SC" \
              -V CJKmainfont="Noto Sans CJK SC" \
              --metadata title="鱿鱼之泪" \
              --metadata author="john2ai" \
              -o 04_exports/squid-tears.pdf
          else
            pandoc $FILES \
              --pdf-engine=xelatex \
              --toc \
              -V geometry:margin=2.5cm \
              -V mainfont="Noto Sans CJK SC" \
              --metadata title="鱿鱼之泪" \
              --metadata author="john2ai" \
              -o 04_exports/squid-tears.pdf
          fi

      - name: 提交导出文件回仓库
        # 不依赖 checkout 生成的 .git（容器内 apk git 与 runner git 存在兼容问题），
        # 用 GITHUB_TOKEN 临时浅克隆提交回仓库
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "== 诊断（工作区 git 状态）=="
          pwd
          git rev-parse --git-dir 2>&1 || echo "NO_GIT_DIR"
          ls -ld "$GITHUB_WORKSPACE/04_exports" 2>&1 || echo "NO_EXPORTS_DIR"

          rm -rf /tmp/exports-repo
          git clone --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/lightconsen/squidtears.git" \
            /tmp/exports-repo
          cd /tmp/exports-repo
          mkdir -p 04_exports
          cp -r "$GITHUB_WORKSPACE/04_exports/." 04_exports/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 04_exports
          if git diff --cached --quiet; then
            echo "导出文件无变化，跳过提交"
          else
            git commit -m "build: 更新导出成品（HTML/DOCX/EPUB/PDF）"
            git push origin main
          fi

      - name: 上传产物（artifact 备份）
        uses: actions/upload-artifact@v4
        with:
          name: squid-tears-exports
          path: |
            04_exports/*.html
            04_exports/*.docx
            04_exports/*.epub
            04_exports/*.pdf
