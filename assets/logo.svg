<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SquidTears</title>
  <desc>卡通鱿鱼 Logo：深海里一只哭着的鱿鱼，八条触手，一滴蓝色眼泪，头顶是海面透下来的光。</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D2F5C"/>
      <stop offset="1" stop-color="#071A33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#BFE3FF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#9CC8FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9CC8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AC9BFF"/>
      <stop offset="1" stop-color="#6C5AE8"/>
    </linearGradient>
    <linearGradient id="tear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8E2FF"/>
      <stop offset="1" stop-color="#5FB2FF"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sea)"/>

  <g clip-path="url(#frame)">
    <!-- 海面透下来的光 -->
    <ellipse cx="256" cy="58" rx="200" ry="86" fill="url(#glow)"/>
    <!-- 星星与气泡 -->
    <path d="M398 72 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#CFE6FF" opacity="0.55"/>
    <path d="M116 96 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#CFE6FF" opacity="0.45"/>
    <circle cx="416" cy="170" r="7" fill="#CFE6FF" opacity="0.18"/>
    <circle cx="104" cy="204" r="5" fill="#CFE6FF" opacity="0.18"/>
    <circle cx="432" cy="236" r="5" fill="#CFE6FF" opacity="0.14"/>
  </g>

  <!-- 后排触手（4条，短） -->
  <g fill="none" stroke="#5443C9" stroke-width="13" stroke-linecap="round">
    <path d="M152 300 C144 322 140 342 146 360 C150 374 168 376 166 362"/>
    <path d="M212 306 C206 326 202 344 208 362 C212 374 228 376 226 362"/>
    <path d="M300 306 C306 326 310 344 304 362 C300 374 284 376 286 362"/>
    <path d="M360 300 C368 322 372 342 366 360 C362 374 344 376 346 362"/>
  </g>

  <!-- 前排触手（4条，长） -->
  <g fill="none" stroke="#6C5AE8" stroke-width="16" stroke-linecap="round">
    <path d="M178 304 C164 334 158 364 166 392 C172 414 194 418 190 398"/>
    <path d="M244 310 C234 340 228 368 234 396 C238 418 218 422 220 402"/>
    <path d="M268 310 C278 340 284 368 278 396 C274 418 294 422 292 402"/>
    <path d="M334 304 C348 334 354 364 346 392 C340 414 318 418 322 398"/>
  </g>

  <!-- 侧鳍 -->
  <path d="M138 204 C110 192 94 212 100 236 C106 258 126 264 144 258 Z" fill="#8F7BFF"/>
  <path d="M374 204 C402 192 418 212 412 236 C406 258 386 264 368 258 Z" fill="#8F7BFF"/>

  <!-- 头部 -->
  <path d="M136 318 C136 190 188 92 256 92 C324 92 376 190 376 318 C376 332 366 338 352 338 L160 338 C146 338 136 332 136 318 Z" fill="url(#body)"/>

  <!-- 眼睛 -->
  <circle cx="212" cy="242" r="34" fill="#FFFFFF"/>
  <circle cx="300" cy="242" r="34" fill="#FFFFFF"/>
  <circle cx="218" cy="248" r="15" fill="#1B2440"/>
  <circle cx="306" cy="248" r="15" fill="#1B2440"/>
  <circle cx="223" cy="242" r="5" fill="#FFFFFF"/>
  <circle cx="311" cy="242" r="5" fill="#FFFFFF"/>

  <!-- 嘴与腮红 -->
  <path d="M240 296 Q256 310 272 296" fill="none" stroke="#1B2440" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="164" cy="282" rx="20" ry="12" fill="#FF9EAE" opacity="0.55"/>
  <ellipse cx="348" cy="282" rx="20" ry="12" fill="#FF9EAE" opacity="0.55"/>

  <!-- 蓝色的眼泪 -->
  <path d="M206 284 C212 298 222 316 222 334 C222 344 215 350 206 350 C197 350 190 344 190 334 C190 316 200 298 206 284 Z" fill="url(#tear)"/>
  <circle cx="200" cy="336" r="4" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="212" cy="382" r="6" fill="#7CC4FF" opacity="0.9"/>
</svg>
